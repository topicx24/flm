name: Günlük M3U Güncelleyici

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Node.js Kurulumu
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Bağımlılıkları Yükle
      run: npm install

    - name: Scripti Çalıştır ve M3U Üret
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: npm start

    - name: Değişiklikleri Kaydet ve GitHub'a Yükle
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add filmler/film_arsivi.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Günlük otomatik M3U güncellemesi" && git push)
