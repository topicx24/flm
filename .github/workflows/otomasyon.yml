name: Günlük M3U Güncelleyici

on:
  schedule:
    - cron: '0 0 * * *' # Her gece otomatik çalışır
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Tüm Git geçmişini çekerek çakışmaları önler

    - name: Node.js Kurulumu
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Bağımlılıkları Yükle
      run: npm install

    - name: Scripti Çalıştır ve M3U Üret
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: npm start

    - name: Değişiklikleri Zorla GitHub'a Yükle
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Dosyayı Git havuzuna kesin olarak ekle
        git add filmler/film_arsivi.m3u
        
        # Değişiklik kontrolünü devre dışı bırakıp her halükarda commit oluştur
        git commit -m "🤖 Günlük otomatik M3U güncellemesi: $(date +'%d.%m.%Y %H:%M:%S')" --allow-empty
        
        # Çakışmaları ezerek deponun main dalına zorla (force push) yükle
        git push origin main --force
